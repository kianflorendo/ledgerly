services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      GITHUB_ALLOWED_REPOS: ${GITHUB_ALLOWED_REPOS:-}
    volumes:
      - app-data:/app/data
    depends_on:
      mailpit:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - model-data:/root/.ollama
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
volumes:
  app-data:
  model-data:
